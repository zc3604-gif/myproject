# Free Supabase projects pause after about a week with no activity, which
# would make the commission form fail. This pings the project's REST API
# every 3 days so it stays awake. The publishable key is public (it is in
# public/portfolio/commission.js too) and row level security lets it read
# nothing, so the request returns an empty list.
name: Supabase keep-alive

on:
  schedule:
    - cron: "17 9 */3 * *"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase
        run: |
          curl -fsS --retry 3 --max-time 30 \
            "https://xcmehnjwckgteltgneqt.supabase.co/rest/v1/commissions?select=id&limit=1" \
            -H "apikey: sb_publishable_domY8AsxTnkeBCH6MzaHeg_I5P7qmgi"
