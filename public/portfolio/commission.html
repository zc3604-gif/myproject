<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <title>Zihan — Commission</title>
    <link rel="stylesheet" href="./style.css?v=35" />
    <style>
      .commission {
        max-width: 640px;
      }
      .commission-intro {
        margin: 0 0 22px;
        color: #333;
        font-size: 13px;
        line-height: 1.6;
      }
      .commission-form {
        display: grid;
        gap: 18px;
        padding: 22px;
        border: 1px solid #111;
        background: #fff;
      }
      .commission-form .field {
        display: grid;
        gap: 6px;
      }
      .commission-form label {
        font-size: 12px;
        letter-spacing: 0.04em;
        text-transform: uppercase;
      }
      .commission-form .hint {
        color: #666;
        font-size: 12px;
      }
      .commission-form input,
      .commission-form textarea,
      .commission-form select {
        width: 100%;
        padding: 9px 10px;
        border: 1px solid #111;
        border-radius: 0;
        background: #fff;
        color: #111;
        font: inherit;
        font-size: 14px;
      }
      .commission-form textarea {
        min-height: 160px;
        resize: vertical;
      }
      .commission-form input:focus,
      .commission-form textarea:focus,
      .commission-form select:focus {
        outline: 2px solid #111;
        outline-offset: 1px;
      }
      .commission-form [aria-invalid="true"] {
        border-color: #b00020;
        outline-color: #b00020;
      }
      .commission-form .error {
        min-height: 1em;
        margin: 0;
        color: #b00020;
        font-size: 12px;
      }
      .budget-row {
        display: grid;
        grid-template-columns: 110px 1fr;
        gap: 8px;
      }
      .commission-form button {
        justify-self: start;
        padding: 10px 18px;
        border: 1px solid #111;
        background: #111;
        color: #fff;
        font: inherit;
        font-size: 14px;
        cursor: pointer;
      }
      .commission-form button:hover {
        background: #fff;
        color: #111;
      }
      .commission-form button:disabled {
        opacity: 0.5;
        cursor: wait;
      }
      .commission-status {
        margin: 0;
        font-size: 13px;
      }
      .commission-status.ok {
        color: #0a6b2d;
      }
      .commission-status.fail {
        color: #b00020;
      }
      @media (max-width: 560px) {
        .works.commission {
          padding-left: 16px;
          padding-right: 16px;
        }
        .commission-form {
          padding: 16px;
        }
        .budget-row {
          grid-template-columns: 90px 1fr;
        }
      }
    </style>
  </head>
  <body class="works-page">
    <header class="chrome">
      <p class="path"><a href="./index.html">Zihan / portfolio</a> <span>/ commission</span></p>
    </header>
    <main class="works commission">
      <div class="works-head">
        <h1>Commission</h1>
        <p>Request a work</p>
      </div>
      <p class="commission-intro">
        Tell me what you have in mind: a p5.js piece, VJ visuals, video, fine art, or a 3D model.
        I'll reply by email.
      </p>

      <form id="commission-form" class="commission-form" novalidate>
        <div class="field">
          <label for="c-email">Email</label>
          <input id="c-email" name="email" type="email" autocomplete="email" placeholder="you@example.com" required />
          <p class="error" id="c-email-error"></p>
        </div>

        <div class="field">
          <label for="c-description">Description</label>
          <span class="hint">What should it be? Include the medium, size or length, deadline, and any references.</span>
          <textarea id="c-description" name="description" maxlength="4000" required></textarea>
          <p class="error" id="c-description-error"></p>
        </div>

        <div class="field">
          <label for="c-budget">Budget</label>
          <div class="budget-row">
            <select id="c-currency" name="currency" aria-label="Currency">
              <option value="USD">USD $</option>
              <option value="EUR">EUR €</option>
              <option value="GBP">GBP £</option>
              <option value="CNY">CNY ¥</option>
            </select>
            <input id="c-budget" name="budget" type="number" inputmode="decimal" min="1" step="any" placeholder="500" required />
          </div>
          <p class="error" id="c-budget-error"></p>
        </div>

        <button type="submit">Send request</button>
        <p class="commission-status" id="commission-status" role="status" aria-live="polite"></p>
      </form>
    </main>
    <script type="module" src="./commission.js?v=1"></script>
  </body>
</html>
